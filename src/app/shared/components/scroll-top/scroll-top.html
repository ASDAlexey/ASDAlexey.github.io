@if (visible()) {
  <button
    appPointerTrack
    aria-label="Scroll to top"
    class="scroll-top"
    i18n-aria-label="@@scrollTop.aria"
    type="button"
    (click)="scrollToTop()"
  >
    <!-- The amber that floods the button on hover, entering from the side the pointer came in on. -->
    <span aria-hidden="true" class="scroll-top__fill"></span>

    <svg aria-hidden="true" class="scroll-top__icon" fill="currentColor" height="20" viewBox="0 0 24 24" width="20">
      <path
        d="M11 8.83V19a1 1 0 0 0 2 0V8.83l3.88 3.88a1 1 0 0 0 1.41-1.42l-5.58-5.58a1 1 0 0 0-1.42 0L5.71 11.3a1 1 0 1 0 1.41 1.42L11 8.83Z"
      />
    </svg>
  </button>
}
