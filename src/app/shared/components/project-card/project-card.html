<!-- appPointerTrack feeds both the spotlight that follows the cursor across the
     card and the slight 3D tilt it leans into; both are styled in CSS. -->
<article appPointerTrack class="card" [class.card--featured]="project().featured">
  <div class="card__head">
    <h3 class="card__title">{{ project().name }}</h3>
    <span class="card__badge">{{ project().badge }}</span>
  </div>

  <p class="card__desc">{{ project().description }}</p>

  @if (cover(); as shot) {
    <button class="card__media" type="button" (click)="lightbox.open()">
      <picture class="card__media-frame" [class.card__media-frame_portrait]="portrait()">
        @if (!shot.vector) {
          <source type="image/avif" [srcset]="shot.thumb" />
          <source type="image/webp" [srcset]="toWebp(shot.thumb)" />
        }

        <img
          class="card__media-thumb"
          decoding="async"
          loading="lazy"
          [alt]="project().imageAlt"
          [class.card__media-thumb_contain]="shot.vector"
          [src]="shot.vector ? shot.thumb : toWebp(shot.thumb)"
        />
      </picture>

      <span class="card__media-text">
        @if (slides().length > 1) {
          <span class="card__media-caption" i18n="@@project.gallery">Open gallery ↗</span>

          <span class="card__media-count">{{ slides().length }}</span>
        } @else {
          <span class="card__media-caption" i18n="@@project.preview">Open full image ↗</span>
        }
      </span>
    </button>

    <app-gallery-lightbox #lightbox [alt]="project().imageAlt ?? ''" [slides]="slides()" />
  }

  @if (project().links.length) {
    <ul class="card__links">
      @for (link of project().links; track link.href) {
        <li>
          <a class="card__link" rel="noreferrer" target="_blank" [href]="link.href">{{ link.label }} ↗</a>
        </li>
      }
    </ul>
  }

  <ul class="tags">
    @for (tag of project().tags; track tag) {
      <li class="tags__item">{{ tag }}</li>
    }
  </ul>
</article>
