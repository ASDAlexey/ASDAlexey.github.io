@if (d(); as path) {
  <svg aria-hidden="true" class="rail" fill="none" [attr.height]="height()" [attr.viewBox]="viewBox()" [attr.width]="width">
    <!-- Faint full-length track, so the route is legible before it is walked. -->
    <path class="rail__track" [attr.d]="path" />

    <!-- The same curve, drawn in as the section scrolls past. -->
    <path class="rail__line" pathLength="1" [attr.d]="path" />

    @for (node of nodes(); track node.index) {
      <circle class="rail__stop" [attr.cx]="node.x" [attr.cy]="node.y" [style.animation-range]="node.litRange" />
    }

    <circle class="rail__runner" cx="0" cy="0" r="4.5" [style.offset-path]="offsetPath()" />
  </svg>
}
