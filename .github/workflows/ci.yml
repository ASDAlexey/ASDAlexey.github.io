name: CI / Deploy

# The pipeline graph. Every stage lives in its own reusable workflow, the way the
# GitLab pipelines this is modelled on keep job templates in `common.yml`:
#
#   quality ─┐
#            ├→ build → lighthouse → deploy (main only)
#   test ────┘
#
# Pull requests run everything except the deploy, against the same artifact.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A superseded pull request commit is worth nothing; a superseded deploy is worth
# finishing, so only PR runs are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    # Draft pull requests skip the whole pipeline (GitLab: `$CI_MERGE_REQUEST_TITLE !~ /^Draft:/`).
    if: ${{ github.event.pull_request.draft != true }}
    uses: ./.github/workflows/quality.yml

  test:
    if: ${{ github.event.pull_request.draft != true }}
    uses: ./.github/workflows/test.yml

  build:
    needs: [quality, test]
    uses: ./.github/workflows/build.yml
    with:
      upload-pages: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  lighthouse:
    needs: build
    uses: ./.github/workflows/lighthouse.yml

  deploy:
    needs: [build, lighthouse]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
